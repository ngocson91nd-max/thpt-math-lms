<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vns_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="vns_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Nền Squircle phong cách hiện đại -->
  <rect width="512" height="512" rx="128" fill="url(#vns_bg)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6" />

  <!-- Monogram V - N - S Toán Học -->
  <g filter="url(#vns_glow)">
    <!-- Chữ V (Vector & Đỉnh nhọn) -->
    <path d="M 86 182 L 158 338 L 226 182" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Chữ N (Số tự nhiên & Ma trận) -->
    <path d="M 242 338 L 242 182 L 320 338 L 320 182" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Chữ S (Tích phân & Đường cong hàm số) -->
    <path d="M 426 202 C 416 166 380 156 352 176 C 320 198 326 240 372 260 C 420 280 430 322 396 346 C 362 368 332 346 324 322" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Điểm tọa độ Toán học ánh sáng Cyan & Gold -->
  <circle cx="426" cy="154" r="16" fill="#38BDF8" />
  <circle cx="86" cy="154" r="14" fill="#FBBF24" />
</svg>